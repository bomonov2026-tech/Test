<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0a12}canvas{display:block}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="g.js"></script>
<script src="g2.js"></script>
<script>
const c=document.getElementById('c').getContext('2d');
function chip(x,y,w,h,f){rr(c,x,y,w,h,h/2);c.fillStyle=f||'rgba(10,8,22,.52)';c.fill();
  c.strokeStyle='rgba(255,255,255,.26)';c.lineWidth=3;rr(c,x,y,w,h,h/2);c.stroke()}
function hud(o){
  c.textBaseline='middle';c.textAlign='center';
  c.fillStyle='rgba(255,255,255,.75)';c.font='800 30px Inter,sans-serif';
  c.fillText('SAKRASH',W/2,132);
  c.fillStyle='#fff';c.font='900 150px Inter,sans-serif';
  c.fillText(o.hops,W/2,236);
  c.fillStyle=GOLD;c.font='800 30px Inter,sans-serif';
  c.fillText('rekord '+o.best,W/2,324);
  chip(40,96,230,78);
  c.textAlign='left';c.fillStyle='#fff';c.font='800 30px Inter,sans-serif';
  c.fillText(o.hat,74,135);
  chip(W-280,96,240,78,'rgba(255,201,40,.94)');
  c.textAlign='center';c.fillStyle='#3A2A00';c.font='900 31px Inter,sans-serif';
  c.fillText(o.left,W-160,135);
  chip(W/2-250,386,500,76,'rgba(43,196,245,.92)');
  c.fillStyle='#04384C';c.font='900 31px Inter,sans-serif';
  c.fillText('🥇 AZIZ — '+o.leader+' sakrash',W/2,424);
}
function scene(o){
  sky(c); far(c);
  o.roofs.forEach(r=>roof(c,r[0],r[1],r[2]));
  if(o.arc){ c.setLineDash([14,16]);c.strokeStyle='rgba(255,255,255,.45)';c.lineWidth=5;
    c.beginPath();
    for(let t=0;t<=1.001;t+=0.02){
      const x=o.arc[0]+(o.arc[2]-o.arc[0])*t, y=o.arc[1]-Math.sin(Math.PI*t)*o.arc[3]+(o.arc[4]-o.arc[1])*t;
      t?c.lineTo(x,y):c.moveTo(x,y);} c.stroke(); c.setLineDash([]); }
  man(c,o.man[0],o.man[1],o.man[2],o.pose,o.hatCol);
  if(o.pw!==undefined) power(c,o.man[0]-110,o.man[1]-20,o.pw);
  hud(o);
  chip(W/2-310,H-150,620,96);
  c.textAlign='center';c.fillStyle='#fff';c.font='800 34px Inter,sans-serif';
  c.fillText('BOSIB TURING  →  QO‘YIB YUBORING',W/2,H-102);
}
/* ================= 2-EKRAN: NATIJA ================= */
function res(o){
  sky(c); far(c);

  const px=70,pw=W-140,py=300,ph=1130;

  c.textAlign='center';c.textBaseline='middle';

  c.fillText('YAKUNIY NATIJA',W/2,py+72);
  c.fillStyle='#fff';c.font='900 190px Inter,sans-serif';
  c.fillText(o.hops,W/2,py+228);
  c.fillStyle='rgba(255,255,255,.6)';c.font='800 34px Inter,sans-serif';
  c.fillText('sakrash',W/2,py+348);

  badge(c,W/2-210,py+396,420,80,GOLD,'🔥 YANGI REKORD','#3A2A00',34);

  let y=py+520;
  row(c,px+44,y,pw-88,'🏆 Turnirdagi o‘rin','2 / 48',CY); y+=104;
  row(c,px+44,y,pw-88,'🎯 Toza qo‘nish','91%','#39E08B'); y+=104;
  row(c,px+44,y,pw-88,'📏 Eng uzun sakrash','214 px'); y+=104;
  row(c,px+44,y,pw-88,'🎩 Yangi shlyapa','5-daraja',GOLD);

  tgbtn(c,px+44,py+ph-172,(pw-128)/2,104,'🔁 QAYTA',GOLD,'#3A2A00');
  tgbtn(c,px+44+(pw-128)/2+40,py+ph-172,(pw-128)/2,104,'📤 GURUHGA',CY,'#04384C');

  chip(W/2-300,H-168,600,96);
  c.textAlign='center';c.fillStyle='#fff';c.font='800 32px Inter,sans-serif';
  c.fillText('Yetakchidan 5 sakrash orqada',W/2,H-120);
}
/* ================= 3-EKRAN: GURUH POSTI ================= */
function post(o){
  const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#121019');g.addColorStop(1,'#0A0810');
  c.fillStyle=g;c.fillRect(0,0,W,H);

  const x=50,w=W-100,y=210,h=1480;
  tgcard(c,x,y,w,h);

  /* sarlavha bloki */
  const hg=c.createLinearGradient(x,y,x+w,y+230);
  hg.addColorStop(0,'#6B3F86');hg.addColorStop(1,'#D1596A');
  c.save();rr(c,x,y,w,230,36);c.clip();c.fillStyle=hg;c.fillRect(x,y,w,230);
  c.fillStyle='rgba(255,201,40,.18)';c.beginPath();c.arc(x+w-60,y+40,170,0,7);c.fill();
  c.restore();
  c.textAlign='left';c.textBaseline='middle';
  c.fillStyle='#fff';c.font='900 52px Inter,sans-serif';
  c.fillText('🏆 15 DAQIQALIK TURNIR',x+44,y+80);
  c.fillStyle='rgba(255,255,255,.8)';c.font='700 32px Inter,sans-serif';
  c.fillText('Toshkent IT Guruh  •  48 ishtirokchi',x+44,y+142);
  c.fillStyle='rgba(255,255,255,.65)';c.font='700 28px Inter,sans-serif';
  c.fillText('Yakunlandi  •  bugun 19:00',x+44,y+190);

  let ry=y+272;
  const rows=[['🥇','Aziz',' 91',0],['🥈','Siz',' 86',1],['🥉','Dilshod',' 79',0],
              ['4','Madina',' 74',0],['5','Jasur',' 71',0],['6','Nodira',' 68',0],['7','Bekzod',' 63',0]];
  rows.forEach(r=>{prow(c,x+34,ry,w-68,r[0],r[1],r[2],r[3]);ry+=112});

  /* o'rtacha / umumiy */
  ry+=14;
  rr(c,x+34,ry,w-68,110,24);c.fillStyle='rgba(43,196,245,.12)';c.fill();
  c.textAlign='left';c.fillStyle='rgba(255,255,255,.72)';c.font='700 30px Inter,sans-serif';
  c.fillText('Guruh jami',x+70,ry+40);
  c.fillStyle=CY;c.font='900 38px Inter,sans-serif';
  c.fillText('2 847 sakrash',x+70,ry+80);
  c.textAlign='right';c.fillStyle='rgba(255,255,255,.72)';c.font='700 30px Inter,sans-serif';
  c.fillText('Kanallar reytingi',x+w-70,ry+40);
  c.fillStyle=GOLD;c.font='900 38px Inter,sans-serif';
  c.fillText('3-o‘rin',x+w-70,ry+80);

  ry+=136;
  c.textAlign='center';c.fillStyle='rgba(255,255,255,.55)';c.font='700 30px Inter,sans-serif';
  c.fillText('Keyingi turnir  •  bugun 21:00',W/2,ry+6);

  /* inline tugmalar */
  const by=y+h-150;
  tgbtn(c,x+34,by,(w-108)/2,110,'🎮 O‘YNASH',GOLD,'#3A2A00');
  tgbtn(c,x+34+(w-108)/2+40,by,(w-108)/2,110,'📊 TO‘LIQ REYTING','rgba(255,255,255,.12)','#fff');
}
</script>
