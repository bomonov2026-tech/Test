# /etc/nginx/sites-available/tgm   (setup.sh DOMAIN ni o'zi almashtiradi)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/tgm/public;
    index index.php;

    server_tokens off;
    client_max_body_size 1m;

    # faqat index.php ochiq; boshqa hamma narsa 404
    location = / { rewrite ^ /index.php last; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/tgm.sock;
        fastcgi_read_timeout 120s;   # MadelineProto login birinchi marta sekin bo'lishi mumkin
    }
    location / { return 404; }
    location ~ /\. { deny all; }
}
