; /etc/php/8.3/fpm/pool.d/tgm.conf — panel uchun alohida pool
[tgm]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-tgm.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
request_terminate_timeout = 150s

env[TGM_APP_DIR] = /var/www/tgm/app
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[expose_php] = Off
php_admin_value[session.save_path] = /var/www/tgm/app/data/php_sessions
